[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bounty-searcher"
description = "Find paid GitHub issues you can actually win."
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["version"]
authors = [{ name = "Shlok Bhusal" }]
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.scripts]
bounty-searcher = "bounty_searcher.cli:main"

[tool.hatch.version]
path = "src/bounty_searcher/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/bounty_searcher"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "C4",   # comprehensions
    "UP",   # pyupgrade
    "SIM",  # simplify
    "PTH",  # prefer pathlib over os.path
]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["src/bounty_searcher"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
